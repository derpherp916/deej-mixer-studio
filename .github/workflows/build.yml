name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc arduino-core-avr simavr \
            libsimavr-dev libelf-dev binutils-mingw-w64-x86-64 nsis zip unzip

      - name: Build and test
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./scripts/build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deej-mixer-studio
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Deej Mixer Studio $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md --verify-tag
